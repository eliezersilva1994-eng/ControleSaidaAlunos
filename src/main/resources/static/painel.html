<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel da Sala</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #FBF4E8;
            color: #4A3F35;
            margin: 0;
            padding: 32px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 4px;
        }
        p.atualizado {
            color: #8A7F72;
            font-size: 13px;
            margin: 0 0 12px;
        }
        .legenda {
            display: flex;
            gap: 20px;
            margin: 0 0 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .legenda span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .legenda .bolinha {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .layout {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }
        .grade {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            flex: 1;
        }
        .quadrado {
            padding: 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.3s ease;
            background: #E15B4F; /* cor de segurança, caso o status não seja reconhecido */
            color: white;
        }
        .status-aguardando { background: #7EB6D9; color: #1f3a4a; }
        .status-chamado { background: #E15B4F; color: white; }
        .vazio { color: #8A7F72; }

        /* Destaque breve quando um aluno acabou de ser chamado */
        @keyframes pulso {
            0%   { transform: scale(1);    box-shadow: 0 0 0 0 rgba(225,91,79,0.45); }
            35%  { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(225,91,79,0); }
            100% { transform: scale(1);    box-shadow: 0 0 0 0 rgba(225,91,79,0); }
        }
        .quadrado.pulso { animation: pulso 1s ease-out 2; }

        .painel-fila {
            width: 240px;
            background: #FFFDF8;
            border: 1px solid #ecdfc9;
            border-radius: 12px;
            padding: 16px;
            flex-shrink: 0;
        }
        .painel-fila h2 {
            font-size: 14px;
            margin: 0 0 10px;
            color: #4A3F35;
        }
        .fila-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #f3ead9;
            font-size: 14px;
        }
        .fila-item:last-child { border-bottom: none; }
        .fila-item .numero {
            color: #E15B4F;
            font-weight: 700;
            margin-right: 6px;
        }
        .fila-item .horario-item {
            color: #8A7F72;
            font-size: 12px;
            white-space: nowrap;
        }
        .fila-vazia { color: #b0a493; font-size: 13px; }
    </style>
</head>
<body>
<h1 id="titulo">Painel da Sala</h1>
<p class="atualizado" id="ultimaAtualizacao">Carregando...</p>

<div class="legenda">
    <span><span class="bolinha" style="background:#7EB6D9;"></span> Aguardando</span>
    <span><span class="bolinha" style="background:#E15B4F;"></span> Pode liberar</span>
</div>

<div class="layout">
    <div class="grade" id="grade"></div>

    <div class="painel-fila">
        <h2>Chamados (ordem de chegada)</h2>
        <div id="fila"></div>
    </div>
</div>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const turmaId = parametros.get('turmaId');

    if (!turmaId) {
        document.getElementById('titulo').textContent = 'Turma não especificada';
    }

    // Guarda o status da última atualização, para saber quem
    // "acabou de ser chamado" e merece a animação de destaque.
    let statusAnterior = {};
    let primeiraCarga = true;

    async function atualizarPainel() {
        try {
            const resposta = await fetch(`/api/registros/status?turmaId=${turmaId}`);
            const alunos = await resposta.json();

            renderizarGrade(alunos);
            renderizarFila(alunos);

            const agora = new Date().toLocaleTimeString('pt-BR');
            document.getElementById('ultimaAtualizacao').textContent = `Atualizado às ${agora}`;

            statusAnterior = Object.fromEntries(alunos.map(a => [a.alunoId, a.status]));
            primeiraCarga = false;

        } catch (erro) {
            document.getElementById('ultimaAtualizacao').textContent =
                'Não foi possível atualizar. Tentando novamente...';
        }
    }

    function renderizarGrade(alunos) {
        const grade = document.getElementById('grade');
        grade.innerHTML = '';

        if (alunos.length === 0) {
            grade.innerHTML = '<p class="vazio">Nenhum aluno cadastrado nesta turma.</p>';
            return;
        }

        for (const aluno of alunos) {
            const div = document.createElement('div');
            const acabouDeSerChamado = !primeiraCarga &&
                statusAnterior[aluno.alunoId] === 'aguardando' && aluno.status === 'chamado';

            div.className = `quadrado status-${aluno.status}` + (acabouDeSerChamado ? ' pulso' : '');
            div.textContent = aluno.nomeAluno;
            grade.appendChild(div);
        }
    }

    function escaparHtml(texto) {
        const div = document.createElement('div');
        div.textContent = String(texto);
        return div.innerHTML;
    }

    function renderizarFila(alunos) {
        const chamados = alunos
            .filter(a => a.status === 'chamado' && a.horario)
            .sort((a, b) => new Date(a.horario) - new Date(b.horario));

        const fila = document.getElementById('fila');

        if (chamados.length === 0) {
            fila.innerHTML = '<p class="fila-vazia">Ninguém foi chamado ainda.</p>';
            return;
        }

        fila.innerHTML = chamados.map((aluno, indice) => {
            const hora = new Date(aluno.horario).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            return `<div class="fila-item">
                    <span><span class="numero">${indice + 1}.</span>${escaparHtml(aluno.nomeAluno)}</span>
                    <span class="horario-item">${hora}</span>
                </div>`;
        }).join('');
    }

    if (turmaId) {
        atualizarPainel();
        // Atualiza a cada 4 segundos (polling) — simples e robusto,
        // funciona mesmo em navegadores de TV mais limitados.
        setInterval(atualizarPainel, 4000);
    }
</script>
</body>
</html>
