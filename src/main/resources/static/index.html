<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Saída de Alunos — Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #FBF4E8;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .caixa {
            background: #FFFDF8;
            border: 1px solid #ecdfc9;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 4px;
            color: #4A3F35;
        }
        p.subtitulo {
            margin: 0 0 24px;
            color: #8A7F72;
            font-size: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4A3F35;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
        }
        input:focus {
            outline: none;
            border-color: #E8823D;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #E8823D;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            background: #f0c9ac;
            cursor: not-allowed;
        }
        .erro {
            background: #fbe9e6;
            color: #C1443C;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>
<div class="caixa">
    <h1>Controle de Saída de Alunos</h1>
    <p class="subtitulo">Entre com seu e-mail e senha</p>

    <div class="erro" id="mensagemErro"></div>

    <form id="formularioLogin">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username">

        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">

        <button type="submit" id="botaoEntrar">Entrar</button>
    </form>
</div>

<script>
    const formulario = document.getElementById('formularioLogin');
    const botaoEntrar = document.getElementById('botaoEntrar');
    const mensagemErro = document.getElementById('mensagemErro');

    formulario.addEventListener('submit', async (evento) => {
        evento.preventDefault();
        mensagemErro.style.display = 'none';
        botaoEntrar.disabled = true;
        botaoEntrar.textContent = 'Entrando...';

        const email = document.getElementById('email').value;
        const senha = document.getElementById('senha').value;

        try {
            const resposta = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
                mostrarErro(dados.erro || 'Não foi possível entrar.');
                return;
            }

            // Guarda os dados do usuário logado para as próximas páginas
            // usarem (só neste navegador — não é enviado a mais ninguém).
            localStorage.setItem('usuarioLogado', JSON.stringify(dados));

            if (dados.turmaId) {
                // Login de sala: vai direto para o painel daquela turma.
                window.location.href = `painel.html?turmaId=${dados.turmaId}`;
            } else if (dados.perfil === 'totem') {
                // Login do tablet da portaria: vai direto para o totem.
                window.location.href = 'totem.html';
            } else {
                // Conta sem sala fixa (ex: admin/secretaria) vai para o
                // painel de administração.
                window.location.href = 'admin.html';
            }

        } catch (erro) {
            mostrarErro('Não foi possível conectar ao servidor. Tente novamente.');
        } finally {
            botaoEntrar.disabled = false;
            botaoEntrar.textContent = 'Entrar';
        }
    });

    function mostrarErro(texto) {
        mensagemErro.textContent = texto;
        mensagemErro.style.display = 'block';
    }
</script>
</body>
</html>
